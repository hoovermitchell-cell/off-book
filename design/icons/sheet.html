<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Off Book — Icon contact sheet</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: var(--text-md); line-height: 1.5; }
    main { max-width: 1120px; margin: auto; padding: var(--space-8) var(--space-6); }
    h1 { margin: 0; font-size: var(--text-2xl); line-height: 1.2; }
    h2 { margin: 0; font-size: var(--text-xl); }
    p { margin: var(--space-2) 0 0; color: var(--ink-soft); }
    section { margin-top: var(--space-8); }
    .icons, .badges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-6); margin-top: var(--space-4); }
    figure { margin: 0; min-width: 0; border-top: 1px solid var(--rule); padding-top: var(--space-3); }
    figcaption { font-weight: 700; }
    .samples { display: flex; align-items: end; gap: var(--space-6); margin-top: var(--space-3); }
    .sample { display: flex; flex-direction: column; align-items: center; justify-content: end; gap: var(--space-2); width: 64px; min-height: 80px; }
    .size { color: var(--ink-soft); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
    .icon { display: block; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon.large { width: 48px; height: 48px; }
    .boards { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-top: var(--space-3); }
    .board { min-height: 80px; display: flex; align-items: center; justify-content: center; gap: var(--space-4); background: var(--board-light); }
    .board.dark { background: var(--board-dark); }
    .board img { display: block; }
    .board-label { margin-top: var(--space-1); color: var(--ink-soft); font-size: var(--text-xs); text-align: center; }
    @media (max-width: 800px) { .icons, .badges { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 520px) { main { padding: var(--space-6) var(--space-4); } .icons { gap: var(--space-4); } .samples { gap: var(--space-2); } .badges { grid-template-columns: 1fr; } }
    @media print { main { max-width: none; } figure { break-inside: avoid; } body { print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
  </style>
</head>
<body>
  <!-- The symbols mirror the standalone SVGs so currentColor works offline,
       including when this sheet is opened directly from the filesystem. -->
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <symbol id="drill" viewBox="0 0 24 24">
        <rect x="3" y="3" width="9" height="9" rx="1"/>
        <path d="M9 17a6 6 0 1 0 8-8M17 5v4h4"/>
      </symbol>
      <symbol id="spar" viewBox="0 0 24 24">
        <path d="M3 20v-4c0-3 1-5 3-6l-1 4 4-1 1-4-4-3V3C3 4 2 7 2 10M2 20h7"/>
        <path d="M21 20v-4c0-3-1-5-3-6l1 4-4-1-1-4 4-3V3c3 1 4 4 4 7M15 20h7"/>
      </symbol>
      <symbol id="review" viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2M7 7h6M7 11h2M7 15h1"/>
        <circle cx="15" cy="15" r="4"/>
        <path d="m18 18 3 3"/>
      </symbol>
      <symbol id="collection" viewBox="0 0 24 24">
        <rect x="3" y="3" width="14" height="18" rx="2"/>
        <path d="M7 3v18M17 6h4v4h-4M17 14h4v4h-4"/>
      </symbol>
      <symbol id="puzzles" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="1"/>
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 6v3M12 15v3M6 12h3M15 12h3"/>
      </symbol>
      <symbol id="weekly-goal" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="16" rx="2"/>
        <path d="M7 3v4M17 3v4M3 10h18m-13 5 3 3 5-5"/>
      </symbol>
      <symbol id="battle-record" viewBox="0 0 24 24">
        <path d="M5 5v14M10 5v14M14 5v14M19 5v14M3 17 21 7"/>
      </symbol>
      <symbol id="how-did-it-know" viewBox="0 0 24 24">
        <rect x="3" y="3" width="6" height="18" rx="1"/>
        <path d="M3 13h6M4 16h4M4 19h4M14 8a3 3 0 1 1 5 2.2c-1.2.8-2 1.3-2 2.8M17 17h.01"/>
      </symbol>
      <symbol id="prep-ends" viewBox="0 0 24 24">
        <path d="M10 6C8 4 5 4 2 4v15c3 0 6 0 8 2 2-2 5-2 8-2v-3M10 6c2-2 5-2 8-2v3M10 6v15M14 11h8m-3-3 3 3-3 3"/>
      </symbol>
      <symbol id="import-games" viewBox="0 0 24 24">
        <path d="M8 7V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-2M13 7h4M16 12h1M12 17h5M2 12h10m-3-3 3 3-3 3"/>
      </symbol>
      <symbol id="backup" viewBox="0 0 24 24">
        <path d="M5 13V3h10l4 4v6M15 3v4h4M12 9v9m-3-3 3 3 3-3M3 17v4h18v-4"/>
      </symbol>
    </defs>
  </svg>
  <main>
    <header>
      <h1>Off Book · Icon contact sheet</h1>
      <p>Custom icons and move-quality badges.</p>
    </header>
    <section aria-labelledby="icons-heading">
      <h2 id="icons-heading">Custom icons</h2>
      <p>20 px and 48 px · Ink on paper</p>
      <div class="icons">
        <figure><figcaption>Drill</figcaption><div class="samples"><div class="sample"><svg class="icon" aria-hidden="true"><use href="#drill"/></svg><span class="size">20 px</span></div><div class="sample"><svg class="icon large" aria-hidden="true"><use href="#drill"/></svg><span class="size">48 px</span></div></div></figure>
        <figure><figcaption>Spar</figcaption><div class="samples"><div class="sample"><svg class="icon" aria-hidden="true"><use href="#spar"/></svg><span class="size">20 px</span></div><div class="sample"><svg class="icon large" aria-hidden="true"><use href="#spar"/></svg><span class="size">48 px</span></div></div></figure>
        <figure><figcaption>Review</figcaption><div class="samples"><div class="sample"><svg class="icon" aria-hidden="true"><use href="#review"/></svg><span class="size">20 px</span></div><div class="sample"><svg class="icon large" aria-hidden="true"><use href="#review"/></svg><span class="size">48 px</span></div></div></figure>
        <figure><figcaption>Collection</figcaption><div class="samples"><div class="sample"><svg class="icon" aria-hidden="true"><use href="#collection"/></svg><span class="size">20 px</span></div><div class="sample"><svg class="icon large" aria-hidden="true"><use href="#collection"/></svg><span class="size">48 px</span></div></div></figure>
        <figure><figcaption>Puzzles</figcaption><div class="samples"><div class="sample"><svg class="icon" aria-hidden="true"><use href="#puzzles"/></svg><span class="size">20 px</span></div><div class="sample"><svg class="icon large" aria-hidden="true"><use href="#puzzles"/></svg><span class="size">48 px</span></div></div></figure>
        <figure><figcaption>Weekly goal</figcaption><div class="samples"><div class="sample"><svg class="icon" aria-hidden="true"><use href="#weekly-goal"/></svg><span class="size">20 px</span></div><div class="sample"><svg class="icon large" aria-hidden="true"><use href="#weekly-goal"/></svg><span class="size">48 px</span></div></div></figure>
        <figure><figcaption>Battle record</figcaption><div class="samples"><div class="sample"><svg class="icon" aria-hidden="true"><use href="#battle-record"/></svg><span class="size">20 px</span></div><div class="sample"><svg class="icon large" aria-hidden="true"><use href="#battle-record"/></svg><span class="size">48 px</span></div></div></figure>
        <figure><figcaption>How did it know?</figcaption><div class="samples"><div class="sample"><svg class="icon" aria-hidden="true"><use href="#how-did-it-know"/></svg><span class="size">20 px</span></div><div class="sample"><svg class="icon large" aria-hidden="true"><use href="#how-did-it-know"/></svg><span class="size">48 px</span></div></div></figure>
        <figure><figcaption>Prep ends</figcaption><div class="samples"><div class="sample"><svg class="icon" aria-hidden="true"><use href="#prep-ends"/></svg><span class="size">20 px</span></div><div class="sample"><svg class="icon large" aria-hidden="true"><use href="#prep-ends"/></svg><span class="size">48 px</span></div></div></figure>
        <figure><figcaption>Import games</figcaption><div class="samples"><div class="sample"><svg class="icon" aria-hidden="true"><use href="#import-games"/></svg><span class="size">20 px</span></div><div class="sample"><svg class="icon large" aria-hidden="true"><use href="#import-games"/></svg><span class="size">48 px</span></div></div></figure>
        <figure><figcaption>Backup</figcaption><div class="samples"><div class="sample"><svg class="icon" aria-hidden="true"><use href="#backup"/></svg><span class="size">20 px</span></div><div class="sample"><svg class="icon large" aria-hidden="true"><use href="#backup"/></svg><span class="size">48 px</span></div></div></figure>
      </div>
    </section>
    <section aria-labelledby="badges-heading">
      <h2 id="badges-heading">Move quality</h2>
      <p>20 px and 32 px · Light and dark board squares</p>
      <div class="badges">
        <figure><figcaption>Book</figcaption><div class="boards"><div><div class="board"><img src="badges/book.svg" width="20" height="20" alt="Book, 20 px"><img src="badges/book.svg" width="32" height="32" alt="Book, 32 px"></div><div class="board-label">Light · 20 / 32 px</div></div><div><div class="board dark"><img src="badges/book.svg" width="20" height="20" alt="Book, 20 px"><img src="badges/book.svg" width="32" height="32" alt="Book, 32 px"></div><div class="board-label">Dark · 20 / 32 px</div></div></div></figure>
        <figure><figcaption>Good · !</figcaption><div class="boards"><div><div class="board"><img src="badges/good.svg" width="20" height="20" alt="Good, 20 px"><img src="badges/good.svg" width="32" height="32" alt="Good, 32 px"></div><div class="board-label">Light · 20 / 32 px</div></div><div><div class="board dark"><img src="badges/good.svg" width="20" height="20" alt="Good, 20 px"><img src="badges/good.svg" width="32" height="32" alt="Good, 32 px"></div><div class="board-label">Dark · 20 / 32 px</div></div></div></figure>
        <figure><figcaption>Interesting · !?</figcaption><div class="boards"><div><div class="board"><img src="badges/interesting.svg" width="20" height="20" alt="Interesting, 20 px"><img src="badges/interesting.svg" width="32" height="32" alt="Interesting, 32 px"></div><div class="board-label">Light · 20 / 32 px</div></div><div><div class="board dark"><img src="badges/interesting.svg" width="20" height="20" alt="Interesting, 20 px"><img src="badges/interesting.svg" width="32" height="32" alt="Interesting, 32 px"></div><div class="board-label">Dark · 20 / 32 px</div></div></div></figure>
        <figure><figcaption>Dubious · ?!</figcaption><div class="boards"><div><div class="board"><img src="badges/dubious.svg" width="20" height="20" alt="Dubious, 20 px"><img src="badges/dubious.svg" width="32" height="32" alt="Dubious, 32 px"></div><div class="board-label">Light · 20 / 32 px</div></div><div><div class="board dark"><img src="badges/dubious.svg" width="20" height="20" alt="Dubious, 20 px"><img src="badges/dubious.svg" width="32" height="32" alt="Dubious, 32 px"></div><div class="board-label">Dark · 20 / 32 px</div></div></div></figure>
        <figure><figcaption>Mistake · ?</figcaption><div class="boards"><div><div class="board"><img src="badges/mistake.svg" width="20" height="20" alt="Mistake, 20 px"><img src="badges/mistake.svg" width="32" height="32" alt="Mistake, 32 px"></div><div class="board-label">Light · 20 / 32 px</div></div><div><div class="board dark"><img src="badges/mistake.svg" width="20" height="20" alt="Mistake, 20 px"><img src="badges/mistake.svg" width="32" height="32" alt="Mistake, 32 px"></div><div class="board-label">Dark · 20 / 32 px</div></div></div></figure>
        <figure><figcaption>Blunder · ??</figcaption><div class="boards"><div><div class="board"><img src="badges/blunder.svg" width="20" height="20" alt="Blunder, 20 px"><img src="badges/blunder.svg" width="32" height="32" alt="Blunder, 32 px"></div><div class="board-label">Light · 20 / 32 px</div></div><div><div class="board dark"><img src="badges/blunder.svg" width="20" height="20" alt="Blunder, 20 px"><img src="badges/blunder.svg" width="32" height="32" alt="Blunder, 32 px"></div><div class="board-label">Dark · 20 / 32 px</div></div></div></figure>
      </div>
    </section>
  </main>
</body>
</html>
